# ROMsounds : compiler le firmware du M-VAVE FM-1 (base Dinghy 0.5), lancer les bancs d'essai sans matériel, vérifier
# le changement de firmware (officiel V16, Dinghy publié, dans les deux sens), puis publier la page d'installation et
# le dernier paquet sur GitHub Pages. Chaîne JieLi : pkgman.jieliapp.com (tools/get_toolchain.sh) ; SDK AC79 : gitee.com.
name: romsounds

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: romsounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fm1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Paquets pour les outils de compilation de Dinghy
        run: python3 -m pip install Pillow

      - name: Installateur web contre un FM-1 simulé (Node)
        working-directory: .
        run: node tests/fm1ota_test.js

      - name: YM2612 (MAME) - tables à jour, rendu identique à libvgm
        run: |
          mkdir -p build
          cc -O2 -w -o build/gen_fmopn_tables tools/gen_fmopn_tables.c -lm
          build/gen_fmopn_tables | cmp - firmware/ext/fmopn/fmopn_tables.h
          cc -O2 -w -Ifirmware/ext/fmopn -o build/fmopn_test tests/fmopn_test.c firmware/ext/fmopn/fmopn.c firmware/ext/fmopn/ymdeltat.c
          test "$(build/fmopn_test | sha256sum | cut -d' ' -f1)" = "$(cat tests/fmopn_test.sha256)"
          echo "rendu identique au cœur GPGX de libvgm"

      - name: Lecteur VGM (sur PC) - envoi par la page relu par le firmware, lecture d'un fichier de test
        run: |
          # le lecteur de prévisualisation de la page (WebAssembly) : clang + wasm-ld
          command -v wasm-ld > /dev/null || sudo apt-get install -y -q lld
          sh tools/build_preview.sh
          cc -O2 -Wall -o build/make_test_vgm tests/make_test_vgm.c -lm
          build/make_test_vgm build/test.vgm
          node ../tests/rx_test.js build/test.vgm build/test.syx build/test.rsm
          cc -O2 -Wall -Ifirmware/src -o build/rx_test tests/rx_test.c
          build/rx_test build/test.syx build/test.rsm
          build/make_test_vgm build/long.vgm long          # plus de 300 Ko ouvert : doit passer une fois préparé
          node ../tests/rx_test.js build/long.vgm build/long.syx build/long.rsm
          build/rx_test build/long.syx build/long.rsm
          ROMSOUNDS_RSM=build/test.rsm sh tests/run_host.sh tests/scripts/lecteur.txt
          # FM 0-2 s, PSG 2-3 s, bruit 3-4 s, DAC 4-5 s, boucle sur le PSG, pause (PLAY) à 6,2 s
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-1.8:5000 2.2-2.9:2000 3.2-3.9:800 4.1-4.9:2000 5.2-6.0:2000 6.5-6.9:0
          # flux DAC (VGM 1.60) convertis par la page : le flux en boucle (5-6 s) puis 500 ms depuis l'octet 512
          build/make_test_vgm build/stream.vgm stream
          node ../tests/rx_test.js build/stream.vgm build/stream.syx build/stream.rsm
          printf '9000 end\n' > build/fin9.txt
          ROMSOUNDS_RSM=build/stream.rsm sh tests/run_host.sh build/fin9.txt
          node ../tests/wav_check.js build/host/romsounds.wav 5.1-5.9:3000 6.1-6.4:1000   # (niveaux égaux à libvgm, vérifié)
          # bibliothèque : trois morceaux reçus et gardés, le précédent (OCT-), un retiré (REC maintenu), Game Gear
          build/make_test_vgm build/gg.vgm gg
          node ../tests/rx_test.js build/gg.vgm build/gg.syx build/gg.rsm
          ROMSOUNDS_RSM=build/test.rsm,build/stream.rsm,build/gg.rsm ROMSOUNDS_EVERY=3000 sh tests/run_host.sh tests/scripts/bibliotheque.txt
          node ../tests/wav_check.js build/host/romsounds.wav 0.3-2.8:5000 3.4-5.8:3000 6.4-8.8:1000 9.8-11.8:3000 16.0-16.9:0
          # Game Boy : voie 1, voie 2 (enveloppe), onde, bruit, puis balayage et durée (niveaux à 1 % de libvgm, vérifié)
          printf '6500 end\n' > build/fin.txt
          build/make_test_vgm build/gb.vgm gb
          node ../tests/rx_test.js build/gb.vgm build/gb.syx build/gb.rsm
          build/rx_test build/gb.syx build/gb.rsm
          ROMSOUNDS_RSM=build/gb.rsm sh tests/run_host.sh build/fin.txt
          node ../tests/wav_check.js build/host/romsounds.wav 0.1-0.9:5000 1.1-1.4:3000 1.8-1.95:0 2.1-2.9:5000 3.1-3.2:2000 3.4-3.9:0 4.05-4.15:3000 4.3-5.9:0 6.05-6.15:3000
          # NES : carrée, carrée (enveloppe), triangle, bruit, DPCM lu dans la mémoire du jeu (carrées et triangle à 1 % de libvgm)
          build/make_test_vgm build/nes.vgm nes
          node ../tests/rx_test.js build/nes.vgm build/nes.syx build/nes.rsm
          build/rx_test build/nes.syx build/nes.rsm
          ROMSOUNDS_RSM=build/nes.rsm sh tests/run_host.sh build/fin.txt
          node ../tests/wav_check.js build/host/romsounds.wav 0.1-0.9:2000 1.1-1.4:2500 2.1-2.9:3000 3.1-3.9:1200 4.5-5.9:8000
          # un pack .zip (comme ceux de VGMRips) : .vgm stocké, .vgz et .vgm compressés, dans un dossier, plus un .txt ignoré
          mkdir -p build/pack/Pack && cd build/pack
          ../make_test_vgm "01 Test.vgm" > /dev/null && ../make_test_vgm "Pack/10 Game Boy.vgm" gb > /dev/null
          ../make_test_vgm nes.vgm nes > /dev/null && gzip -c nes.vgm > "02 NES.vgz" && printf 'notes' > readme.txt
          zip -q -0 ../pack.zip "01 Test.vgm" && zip -q ../pack.zip readme.txt "02 NES.vgz" "Pack/10 Game Boy.vgm"
          cd ../..
          node ../tests/zip_test.js build/pack.zip "build/pack/01 Test.vgm" "build/pack/02 NES.vgz" "build/pack/Pack/10 Game Boy.vgm"
          # bibliothèque à tasser : B (40 Ko) retiré entre A et C, D (80 Ko) n'entre qu'une fois C descendu ; C relu et joué
          for x in A:100 B:40 C:101 D:80; do node ../tests/big_rsm.js build/test.rsm build/${x%%:*}.rsm ${x##*:}; done
          ROMSOUNDS_RSM=build/A.rsm,build/B.rsm,build/C.rsm,build/D.rsm ROMSOUNDS_EVERY=5000 sh tests/run_host.sh tests/scripts/tassement.txt | tee build/tasse.log
          # la place annoncée à la page après D : 3 morceaux, 25 + 26 + 20 secteurs de 4 Ko sur 73
          grep -q "BF 119 3" build/tasse.log && grep -q "BF 120 71" build/tasse.log && grep -q "BF 121 73" build/tasse.log
          node ../tests/wav_check.js build/host/romsounds.wav 16.6-18.2:5000
          # l'écoute dans la page (preview.wasm) : le même son que le lecteur du FM-1 (à 1 % près par seconde)
          build/make_test_vgm build/gb.vgm gb > /dev/null && node ../tests/rx_test.js build/gb.vgm build/x.syx build/gb.rsm > /dev/null
          node ../tests/preview_test.js build/gb.rsm 6 build/pv_gb.wav
          printf '6100 end\n' > build/f6.txt && ROMSOUNDS_RSM=build/gb.rsm sh tests/run_host.sh build/f6.txt > /dev/null
          node ../tests/wav_compare.js build/pv_gb.wav build/host/romsounds.wav 1 6 1
          node ../tests/preview_test.js build/test.rsm 6 build/pv_test.wav
          node ../tests/wav_check.js build/pv_test.wav 0.2-1.8:5000 2.2-2.9:2000 4.1-4.9:2000
          # AY-3-8910 / YM2149 (Atari ST) : voie A à 440 Hz, enveloppe, bruit, les trois ; et de vrais .ym (exemples de StSound,
          # licence MIT), relus par la page puis joués sur PC et dans la page (même son)
          build/make_test_vgm build/ay.vgm ay > /dev/null && node ../tests/rx_test.js build/ay.vgm build/x.syx build/ay.rsm
          ROMSOUNDS_RSM=build/ay.rsm sh tests/run_host.sh build/f6.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:~440 1.1-1.9:1000 2.1-2.9:1000 3.1-4.9:2000
          git clone -q --depth 1 https://github.com/arnaud-carre/StSound.git build/StSound
          node ../tests/ym_test.js build/StSound/YmSampleFiles build/scout.rsm
          printf '20000 end\n' > build/f20.txt && ROMSOUNDS_RSM=build/scout.rsm sh tests/run_host.sh build/f20.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 1-19:3000
          node ../tests/preview_test.js build/scout.rsm 20 build/pv_scout.wav
          node ../tests/wav_compare.js build/pv_scout.wav build/host/romsounds.wav 4 20 1
          # PC (AdLib) : OPL2 (YM3812, fmopl.c de MAME), tables à jour ; sinus à 440 Hz, FM, percussions, accord en boucle,
          # joué sur PC et dans la page (même son)
          cc -O2 -w -o build/gen_fmopl_tables tools/gen_fmopl_tables.c -lm
          build/gen_fmopl_tables | cmp - firmware/ext/fmopl/fmopl_tables.h
          build/make_test_vgm build/opl.vgm opl > /dev/null && node ../tests/rx_test.js build/opl.vgm build/x.syx build/opl.rsm
          ROMSOUNDS_RSM=build/opl.rsm sh tests/run_host.sh build/f6.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:~440 1.1-1.9:1000 2.1-2.9:1000 3.1-4.9:1000 5.2-5.9:1000
          node ../tests/preview_test.js build/opl.rsm 6 build/pv_opl.wav
          node ../tests/wav_compare.js build/pv_opl.wav build/host/romsounds.wav 1 6 1
          # OPL3 (Sound Blaster 16) : la page le réécrit pour l'OPL2 (banque 0, sans stéréo) : même son que le morceau OPL2
          cp build/host/romsounds.wav build/opl-host.wav
          build/make_test_vgm build/opl3.vgm opl3 > /dev/null && node ../tests/rx_test.js build/opl3.vgm build/x.syx build/opl3.rsm
          ROMSOUNDS_RSM=build/opl3.rsm sh tests/run_host.sh build/f6.txt > /dev/null
          node ../tests/wav_compare.js build/host/romsounds.wav build/opl-host.wav 1 6 0.5
          # Neo-Geo : YM2610 (FM, SSG, ADPCM-A, ADPCM-B) ; la page ne garde que les échantillons joués (ROM de 3 Mo -> 12 Ko)
          # et réécrit leurs adresses ; joué sur PC, voix coupées au clavier, et dans la page (même son)
          build/make_test_vgm build/neogeo.vgm neogeo > /dev/null && node ../tests/rx_test.js build/neogeo.vgm build/x.syx build/neogeo.rsm
          test "$(stat -c %s build/neogeo.rsm)" -lt 20000
          ROMSOUNDS_RSM=build/neogeo.rsm sh tests/run_host.sh build/f6.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:~440 1.1-1.9:~1000 2.05-2.45:~500 2.6-2.8:1000 3.1-3.9:~926 4.1-5.9:1000
          node ../tests/preview_test.js build/neogeo.rsm 6 build/pv_neogeo.wav
          node ../tests/wav_compare.js build/pv_neogeo.wav build/host/romsounds.wav 1 6 1
          ROMSOUNDS_RSM=build/neogeo.rsm sh tests/run_host.sh tests/scripts/neogeo_voix.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:0 1.1-1.9:~1000 2.05-2.45:0 3.1-3.9:~926
          # arcade : YM2151 + OKI MSM6295 (CPS1), tables du YM2151 à jour ; la page refait la ROM de l'OKI (phrases jouées,
          # banques retirées) ; puis le YM2203 (FM + SSG) ; sur PC, voix coupées, et dans la page (même son)
          cc -O2 -w -o build/gen_ym2151_tables tools/gen_ym2151_tables.c -lm
          build/gen_ym2151_tables | cmp - firmware/ext/ym2151/ym2151_tables.h
          printf '4100 end\n' > build/f4.txt
          for m in arcade arcadeb; do
            build/make_test_vgm build/$m.vgm $m > /dev/null && node ../tests/rx_test.js build/$m.vgm build/x.syx build/$m.rsm
            test "$(stat -c %s build/$m.rsm)" -lt 8000
            ROMSOUNDS_RSM=build/$m.rsm sh tests/run_host.sh build/f4.txt > /dev/null
            node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:~440 1.05-1.45:~505 1.55-1.7:1000 2.1-3.9:1000
          done
          node ../tests/preview_test.js build/arcade.rsm 4 build/pv_arcade.wav
          node ../tests/wav_compare.js build/pv_arcade.wav build/host/romsounds.wav 1 4 1
          ROMSOUNDS_RSM=build/arcade.rsm sh tests/run_host.sh tests/scripts/arcade_voix.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:0 1.05-1.45:0 1.55-1.7:1000
          build/make_test_vgm build/opn.vgm opn > /dev/null && node ../tests/rx_test.js build/opn.vgm build/x.syx build/opn.rsm
          ROMSOUNDS_RSM=build/opn.rsm sh tests/run_host.sh build/f4.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-0.9:~440 1.1-1.9:~1000 2.1-3.9:1000
          # Amiga : un module de test (tests/make_test_mod.js) préparé par la page, joué sur PC (hauteurs, coupures, glissando,
          # retour au début) et dans la page (même son)
          node ../tests/make_test_mod.js build/test.mod
          node -e 'const R=require("../web/romsounds.js"),fs=require("fs");fs.writeFileSync("build/mod.rsm",R.packMod(new Uint8Array(fs.readFileSync("build/test.mod")),"test.mod").blob)'
          printf '8500 end\n' > build/f85.txt && ROMSOUNDS_RSM=build/mod.rsm sh tests/run_host.sh build/f85.txt > /dev/null
          node ../tests/wav_check.js build/host/romsounds.wav 0.2-1.9:~259 2.0-3.8:~518 4.0-5.7:1000 7.2-7.4:~259 7.5-7.65:0 7.75-8.4:~259
          node ../tests/preview_test.js build/mod.rsm 8.4 build/pv_mod.wav
          node ../tests/wav_compare.js build/pv_mod.wav build/host/romsounds.wav 1 8 1
          # la bibliothèque vue par la page : liste (SysEx 05), place pour D, retrait de B (06)
          node ../tests/lib_test.js
          # effets : tempo 200 % (fréquences de build/gb.rsm deux fois plus tôt), voix coupées, solo (SEL + touche),
          # hauteur +12 (OCT+), passe-bas 150 Hz, écho, boucle (FX tenu), HOME, grain, flanger / phaser, beat roll,
          # vinyl brake (arrêt, PLAY relance), backspin (à l'envers, plus aigu), presets (SAVE / EDIT + touche)
          fx() { s=$1; f=$2; shift 2; ROMSOUNDS_RSM=build/$f.rsm sh tests/run_host.sh tests/scripts/$s.txt > /dev/null; node ../tests/wav_check.js build/host/romsounds.wav "$@"; }
          fx fx_tempo gb 0.05-0.45:~440 0.55-0.75:~880 1.25-1.45:~262
          fx fx_voix test 0.2-1.8:0 2.2-2.9:2000
          fx fx_solo test 0.3-1.8:0 2.2-2.9:2000/6000
          fx fx_hauteur gb 0.2-0.9:~880
          fx fx_filtre gb 0.2-0.9:1/2000
          fx fx_echo gb 1.8-1.95:1 3.4-3.9:1 4.5-5.9:0
          fx fx_grain gb 0.1-0.9:1000
          fx fx_mod gb 0.1-0.9:1000 1.1-1.9:1
          fx fx_roll gb 3.5-3.9:1 4.2-4.4:0
          fx fx_brake gb 0.05-0.25:~440 1.8-2.45:0 2.65-2.8:~880
          fx fx_spin gb 2.52-2.6:~262 2.75-2.85:~570 2.95-2.999:~262
          fx fx_preset gb 0.4-0.6:4000 0.9-0.99:1/2000
          # attribution par la page (SysEx 07, relue par 08) : le filtre sur KNOB1
          M="03 00 00 00 00 00 01 02 03 0B 07 06 0A 00 08 09 04 05"
          ROMSOUNDS_SX="0:7D 52 53 07 $M;100:7D 52 53 08" ROMSOUNDS_RSM=build/gb.rsm sh tests/run_host.sh tests/scripts/fx_map.txt > build/map.log
          grep -q "BF 117 10" build/map.log && grep -q "SYSEX out F0 7D 52 53 18 $M F7" build/map.log
          node ../tests/wav_check.js build/host/romsounds.wav 0.4-0.9:1/2000

      - name: Chaîne JieLi (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: SDK JieLi AC79 (trois de ses fichiers vont dans le paquet)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Compiler (SMK-37 d'abord, FM-1 en dernier, comme l'attendent les tests de Dinghy)
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh
          ls -l build/*.fwsc

      - name: Bancs d'essai de Dinghy (sans matériel)
        run: sh tests/run_tests.sh

      - name: Changer de firmware (ota.c) - officiel V16, Dinghy, dans les deux sens
        run: |
          mkdir -p build/tests
          cc -O2 -w -o build/tests/ota_test tests/ota_test.c
          rs=build/romsounds.fwsc
          echo "=== ROMsounds par-dessus ROMsounds"
          build/tests/ota_test "$rs"
          # Un autre firmware maison : Dinghy tel que publié par son auteur (zvenson/dinghy, dernière release FM-1)
          rel=$(curl -sSf -m 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/zvenson/dinghy/releases?per_page=10 || true)
          url=$(printf "%s" "$rel" | jq -r "[.[].assets[].browser_download_url | select(test(\"/dinghy-[0-9.]+\\\\.fwsc$\"))] | first // empty")
          if [ -n "$url" ] && curl -sSfL -m 60 -o "$RUNNER_TEMP/dinghy.fwsc" "$url"; then
            echo "Dinghy : $url"
            echo "=== Dinghy par-dessus ROMsounds"
            build/tests/ota_test "$RUNNER_TEMP/dinghy.fwsc" "$rs"
            echo "=== ROMsounds par-dessus Dinghy (ota.c de ROMsounds : sens indicatif)"
            build/tests/ota_test "$rs" "$RUNNER_TEMP/dinghy.fwsc"
          else
            echo "::warning::paquet Dinghy introuvable : test de changement entre firmwares maison sauté"
          fi
          # FM-1.fwsc de M-VAVE : téléchargé pour ce test seulement, jamais publié ni gardé en artefact
          if curl -sSf -m 120 -o "$RUNNER_TEMP/FM-1.fwsc" https://yms-file-store.oss-cn-hongkong.aliyuncs.com/software/firmware/FM-1.fwsc; then
            sha256sum "$RUNNER_TEMP/FM-1.fwsc"
            echo "=== firmware officiel par-dessus ROMsounds"
            build/tests/ota_test "$RUNNER_TEMP/FM-1.fwsc" "$rs"
            rm -f "$RUNNER_TEMP/FM-1.fwsc"
          else
            echo "::warning::FM-1.fwsc de M-VAVE injoignable : test du retour officiel sauté"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Site (page d'installation + dernier paquet)
        run: |
          site="$GITHUB_WORKSPACE/site"
          mkdir -p "$site"
          cp ../web/* "$site/"
          cp build/romsounds.fwsc "$site/romsounds.fwsc"
          size=$(stat -c %s "$site/romsounds.fwsc")
          sha=$(sha256sum "$site/romsounds.fwsc" | cut -d' ' -f1)
          jq -n --arg file romsounds.fwsc --arg product FM-1_950 --argjson size "$size" --arg sha256 "$sha" \
                --arg commit "${GITHUB_SHA::7}" --arg ref "$GITHUB_REF_NAME" \
                --arg message "$(printf '%s' "$MSG" | head -n1 | cut -c1-120)" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{file:$file, product:$product, size:$size, sha256:$sha256, commit:$commit, ref:$ref, message:$message, date:$date, run:$run}' \
                > "$site/latest.json"
          cat "$site/latest.json"
          touch "$site/.nojekyll"
        env:
          MSG: ${{ github.event.head_commit.message }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  pages:
    needs: firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
